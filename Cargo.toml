[package]
name = "sudoku"
version = "1.0.0"
edition = "2024"
description = "A fast, responsive Sudoku game, generator, and solver for the terminal"
license = "BUSL-1.1"
repository = "https://github.com/kpihx-labs/sudoku"
keywords = ["game", "sudoku", "terminal", "tui"]
categories = ["command-line-utilities", "games"]

[dependencies]
chrono = "0.4"
crossterm = "0.29"
dirs = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
